name: ci

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --no-banner --log-opts=HEAD .

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # none of these publish signatures, so they are pinned by digest
      TERRAFORM_IMAGE: hashicorp/terraform:1.16.5@sha256:c7926feace05d0f7e73542842bf3945924e955a1f782cf000ccbb8d18fa42d77
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.64.0@sha256:1c595f42d794c32c45a6ea8b58655fd66433d4ca3b1bc631c574a48d120bd19f
      CHECKOV_IMAGE: bridgecrew/checkov:3.3.28@sha256:19ab1e9a08bf76f78391ca6fa46bb62fd08737e4e66466b16a82aa2d1337e153
      CONFTEST_IMAGE: openpolicyagent/conftest:v0.71.1@sha256:0e77cdf7c1fcde035f3c579e4aaa6664ee2a8be5777eaa9af9f520cdd02280c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: format
        run: docker run --rm -v "$PWD:/work" -w /work "$TERRAFORM_IMAGE" fmt -check -diff -recursive infra
      # no backend and no credentials: this only checks the code, it never reads the state
      - name: validate
        run: |
          for stack in infra/*/; do
            [ -f "$stack/backend.tf" ] || continue
            echo "== $stack"
            docker run --rm -v "$PWD:/work" -w "/work/$stack" -e TF_DATA_DIR=/tmp/terraform --entrypoint sh "$TERRAFORM_IMAGE" \
              -c 'terraform init -backend=false -lockfile=readonly -input=false && terraform validate'
          done
      # tflint --init downloads the aws ruleset from github, which rate limits anonymous calls from shared runners
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/work" -w /work --entrypoint sh "$TFLINT_IMAGE"
          -c 'export HOME="$(mktemp -d)" && tflint --init --config=/work/.tflint.hcl && tflint --recursive --chdir=infra --config=/work/.tflint.hcl'
      # --skip-download keeps checkov from calling the prisma cloud api, so it runs offline
      - name: checkov
        run: >-
          docker run --rm --network none -v "$PWD:/work" -w /work "$CHECKOV_IMAGE"
          -d infra --framework terraform --quiet --compact --skip-download
      # the unit tests of the plan policies; the policies themselves run on real plans in terraform.yml
      - name: conftest
        run: >-
          docker run --rm --network none -v "$PWD:/work" -w /work "$CONFTEST_IMAGE"
          verify --no-color --policy policy
